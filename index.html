<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Eusebio Wines · Catálogo de vinos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Playfair+Display:wght@400;500&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bordo: #5B1E2A;
      --crema: #F6F2E9;
      --papel: #FFFDF8;
      --linea: #DDD5C0;
      --oliva: #5F6450;
      --tinta: #2A2623;
      --serif: 'Playfair Display', Georgia, serif;
      --sans: 'Montserrat', system-ui, sans-serif
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--crema);
      color: var(--tinta);
      font: 15px/1.5 var(--sans)
    }

    button,
    input,
    select {
      font: inherit
    }

    :focus-visible {
      outline: 2px solid var(--bordo);
      outline-offset: 2px
    }

    header {
      background: var(--bordo);
      color: var(--crema);
      text-align: center;
      padding: 38px 20px 30px
    }

    header h1 {
      font: 400 34px var(--serif);
      letter-spacing: .35em;
      margin: 0;
      padding-left: .35em
    }

    header p {
      margin: 6px 0 0;
      font-size: 12px;
      letter-spacing: .35em;
      padding-left: .35em
    }

    header em {
      display: block;
      font: italic 400 18px var(--serif);
      margin-top: 18px
    }

    nav {
      position: sticky;
      top: 0;
      z-index: 5;
      background: var(--crema);
      border-bottom: 1px solid var(--linea);
      padding: 10px 16px
    }

    .tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      max-width: 760px;
      margin: auto
    }

    .tabs button {
      background: none;
      border: 1px solid var(--linea);
      color: var(--oliva);
      border-radius: 20px;
      padding: 7px 14px;
      font-weight: 500;
      font-size: 13px;
      white-space: nowrap;
      cursor: pointer
    }

    .tabs button.on {
      background: var(--bordo);
      border-color: var(--bordo);
      color: var(--crema)
    }

    .tabs button.tab-promo {
      border-color: var(--bordo);
      color: var(--bordo);
      font-weight: 600
    }

    .tabs button.tab-promo.on {
      background: var(--bordo);
      color: var(--crema)
    }

    .filtros {
      display: flex;
      gap: 8px;
      max-width: 760px;
      margin: 8px auto 0
    }

    .filtros input,
    .filtros select,
    .sheet input,
    .sheet select {
      flex: 1;
      min-width: 0;
      padding: 9px 11px;
      border: 1px solid var(--linea);
      background: var(--papel);
      border-radius: 6px;
      color: var(--tinta)
    }

    main {
      max-width: 760px;
      margin: auto;
      padding: 4px 16px 120px
    }

    h3 {
      font: 600 12px var(--sans);
      letter-spacing: .2em;
      color: var(--oliva);
      margin: 26px 0 2px;
      text-transform: uppercase
    }

    .row {
      display: grid;
      grid-template-columns: 44px 1fr auto;
      gap: 14px;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid var(--linea)
    }

    .b {
      width: 44px;
      height: 68px;
      justify-self: center;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .b svg {
      width: 18px;
      height: 62px
    }

    .b .foto {
      max-width: 44px;
      max-height: 68px;
      object-fit: contain;
      border-radius: 3px
    }

    .nom {
      font: 400 19px/1.2 var(--serif)
    }

    .sub {
      font-size: 12px;
      color: var(--oliva);
      margin-top: 2px
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 7px
    }

    .tags span {
      border: 1px solid var(--linea);
      padding: 1px 7px;
      font-size: 11px;
      color: var(--oliva)
    }

    .tags .promo {
      background: var(--oliva);
      border-color: var(--oliva);
      color: var(--crema)
    }

    .der {
      text-align: right
    }

    .pre {
      font: 400 21px var(--serif);
      color: var(--bordo)
    }

    .der small {
      display: block;
      font-size: 11px;
      color: var(--oliva)
    }

    .add {
      margin-top: 8px;
      background: none;
      border: 1px solid var(--bordo);
      color: var(--bordo);
      padding: 6px 14px;
      border-radius: 4px;
      font-weight: 500;
      font-size: 12px;
      cursor: pointer
    }

    .st {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px
    }

    .st button {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 0;
      background: var(--bordo);
      color: var(--crema);
      font-size: 17px;
      line-height: 1;
      cursor: pointer
    }

    .vacio {
      text-align: center;
      color: var(--oliva);
      padding: 40px 0
    }

    footer {
      text-align: center;
      font-size: 12px;
      color: var(--oliva);
      padding: 0 20px 110px
    }

    #bar {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: 16px;
      max-width: 728px;
      margin: auto;
      display: none;
      justify-content: space-between;
      background: var(--bordo);
      color: var(--crema);
      border: 0;
      border-radius: 8px;
      padding: 15px 20px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(42, 38, 35, .3)
    }

    #bar.on {
      display: flex
    }

    .drawer {
      position: fixed;
      inset: 0;
      display: none;
      background: rgba(42, 38, 35, .55);
      z-index: 10
    }

    .drawer.on {
      display: flex;
      align-items: flex-end;
      justify-content: center
    }

    .sheet {
      background: var(--papel);
      width: 100%;
      max-width: 560px;
      max-height: 92vh;
      overflow: auto;
      padding: 22px;
      border-radius: 14px 14px 0 0
    }

    .sheet h2 {
      font: 400 26px var(--serif);
      color: var(--bordo);
      margin: 0 0 8px
    }

    .li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--linea);
      font-size: 14px
    }

    .li-info {
      flex: 1;
      min-width: 0
    }

    .li-info b {
      display: block;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.2
    }

    .li-info small {
      color: var(--oliva);
      font-size: 12px
    }

    .li-actions {
      display: flex;
      align-items: center;
      gap: 8px
    }

    .st.st-sm {
      margin-top: 0;
      gap: 6px
    }

    .st.st-sm button {
      width: 26px;
      height: 26px;
      font-size: 15px
    }

    .li-sub {
      font-weight: 600;
      font-size: 14px;
      min-width: 60px;
      text-align: right;
      color: var(--bordo)
    }

    .del {
      background: none;
      border: 0;
      color: #999;
      font-size: 17px;
      line-height: 1;
      padding: 4px 6px;
      cursor: pointer;
      border-radius: 4px
    }

    .del:hover {
      color: var(--bordo);
      background: rgba(91, 30, 42, .08)
    }

    .li.d {
      color: var(--oliva)
    }

    .tot {
      display: flex;
      justify-content: space-between;
      font: 400 24px var(--serif);
      color: var(--bordo);
      padding: 14px 0
    }

    .sheet label {
      display: block;
      font-size: 12px;
      color: var(--oliva);
      margin: 10px 0 4px
    }

    .sheet input,
    .sheet select {
      width: 100%
    }

    .send {
      width: 100%;
      margin-top: 16px;
      background: var(--bordo);
      color: var(--crema);
      border: 0;
      border-radius: 8px;
      padding: 15px;
      font-weight: 600;
      cursor: pointer
    }

    .cerrar {
      background: none;
      border: 0;
      color: var(--oliva);
      width: 100%;
      padding: 12px;
      cursor: pointer
    }
  </style>
</head>

<body>
  <header>
    <h1>EUSEBIO</h1>
    <p>WINES</p>
    <em>Buenos vinos, grandes momentos.</em>
  </header>
  <nav>
    <div class="tabs" id="tabs"></div>
    <div class="filtros">
      <input id="q" type="search" placeholder="Buscar vino, bodega o varietal">
      <select id="bod" aria-label="Filtrar por bodega">
        <option value="">Todas las bodegas</option>
      </select>
    </div>
  </nav>
  <main id="lista"></main>
  <footer>Precios por botella, en pesos argentinos · Retiro y envíos en Mendoza<br>Venta solo a mayores de 18 años
  </footer>
  <button id="bar"></button>
  <div class="drawer" id="drawer">
    <div class="sheet" id="sheet"></div>
  </div>

  <script>
    /* ===== CONFIGURACIÓN ===== */
    const WHATSAPP = '5492615668893'; // código de país + área + número, sin + ni espacios
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT8rOJx8MT8QXcsT8ZF0yCO9CdY4Ovw0oLNNl086-ogn4MUFmySPfOPk_8T9nZsGEB0JxeghFSTW1hm/pub?gid=587360108&single=true&output=csv';             // link CSV publicado de Google Sheets; vacío = usa productos.csv

    const $ = s => document.querySelector(s);
    const money = n => '$' + Math.round(n).toLocaleString('es-AR');
    const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const COLORES = { tinto: '#1F2F25', blanco: '#8FA66B', rosado: '#D79BA6', espumante: '#8A7240', generoso: '#6B3F1D' };
    const color = c => (Object.entries(COLORES).find(([k]) => c.toLowerCase().startsWith(k)) || [0, '#1F2F25'])[1];
    const BOTELLA = '<svg viewBox="0 0 16 56" aria-hidden="true"><path d="M6 0h4v14c0 4 5 7 5 14v26a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V28c0-7 5-10 5-14z" fill="currentColor"/></svg>';

    let P = [], cat = '', cart = {};
    try { cart = JSON.parse(localStorage.getItem('eusebio-pedido') || '{}'); } catch (e) { }

    function getImgUrl(url) {
      if (!url) return '';
      url = url.trim();
      const m = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || url.match(/[?&]id=([a-zA-Z0-9_-]+)/) || url.match(/\/d\/([a-zA-Z0-9_-]+)/);
      if (m) {
        return `https://drive.google.com/thumbnail?id=${m[1]}&sz=w400`;
      }
      return url;
    }

    fetch(SHEET_URL || 'productos.csv').then(r => r.text()).then(t => {
      P = t.trim().split(/\r?\n/).slice(1).map(l => {
        const c = l.split(',').map(s => s.replace(/^"|"$/g, '').trim());
        const pc = +c[8] || 0;
        const pp = +c[9] || 0;
        const pg = c[7] || (pc && pp ? c[2] + '|' + c[4] : '');
        return {
          cat: c[0] || '',
          bod: c[1] || '',
          nom: c[2] || '',
          var: c[3] || '',
          ml: +c[4] || 750,
          pre: +c[5] || 0,
          on: (c[6] || 'si').toLowerCase() !== 'no',
          pg: pg,
          pc: pc,
          pp: pp,
          img: c[10] || '',
          k: (c[2] || '') + '|' + (c[4] || '')
        };
      }).filter(p => p.on && p.nom);
      cat = P[0].cat;
      const cats = [...new Set(P.map(p => p.cat))];
      const hayPromos = P.some(p => p.pc > 0 && p.pp > 0);
      const promoBtn = hayPromos ? `<button data-cat="PROMOS" class="tab-promo">🔥 Promos</button>` : '';
      $('#tabs').innerHTML = promoBtn + cats.map(c => `<button data-cat="${esc(c)}">${esc(c)}</button>`).join('');
      $('#bod').innerHTML = '<option value="">Todas las bodegas</option>' + [...new Set(P.map(p => p.bod))].map(b => `<option>${esc(b)}</option>`).join('');
      pintar();
    }).catch(() => { $('#lista').innerHTML = '<p class="vacio">No pudimos cargar los vinos. Probá de nuevo en unos minutos.</p>'; });

    function lista() {
      const q = $('#q').value.toLowerCase().trim(), b = $('#bod').value;
      const esPromo = cat === 'PROMOS';
      const items = P.filter(p => {
        if (q) return (p.nom + p.bod + p.var + p.cat).toLowerCase().includes(q);
        if (esPromo) return (p.pc > 0 && p.pp > 0) && (!b || p.bod === b);
        return p.cat === cat && (!b || p.bod === b);
      });
      let h = '', last = '';
      items.forEach(p => {
        const g = q || esPromo ? p.cat + ' · ' + p.bod : p.bod;
        if (g !== last) { h += `<h3>${esc(p.bod)}${(q || esPromo) ? ' · ' + esc(p.cat) : ''}</h3>`; last = g; }
        const n = cart[p.k] || 0, k = esc(p.k);
        const foto = getImgUrl(p.img);
        const media = foto 
          ? `<img src="${esc(foto)}" alt="${esc(p.nom)}" class="foto" loading="lazy" onerror="this.outerHTML='${BOTELLA}'">`
          : BOTELLA;
        h += `<div class="row"><span class="b" style="color:${color(p.cat)}">${media}</span>
      <div><div class="nom">${esc(p.nom)}</div><div class="sub">${esc(p.var)}</div>
      <div class="tags"><span>${p.ml} ml</span>${p.ml < 500 ? '<span>Media botella</span>' : ''}${p.pc ? `<span class="promo">Llevá ${p.pc} por ${money(p.pp)}</span>` : ''}</div></div>
      <div class="der"><div class="pre">${money(p.pre)}</div><small>por botella</small>
      ${n ? `<div class="st"><button data-k="${k}" data-d="-1" aria-label="Quitar uno">−</button><b>${n}</b><button data-k="${k}" data-d="1" aria-label="Agregar uno">+</button></div>`
            : `<button class="add" data-k="${k}" data-d="1">Agregar</button>`}</div></div>`;
      });
      $('#lista').innerHTML = h || `<p class="vacio">${esPromo ? 'No hay promociones activas por el momento.' : 'No encontramos vinos con esa búsqueda. Probá con otro nombre o varietal.'}</p>`;
    }

    function calc() {
      let sub = 0, u = 0, g = {}, lineas = [], desc = [];
      P.forEach(p => {
        const n = cart[p.k] || 0; if (!n) return;
        lineas.push([p, n]); sub += n * p.pre; u += n;
        if (p.pg) { const x = g[p.pg] = g[p.pg] || { n: 0, s: 0, pc: p.pc, pp: p.pp }; x.n += n; x.s += n * p.pre; }
      });
      Object.values(g).forEach(x => {
        const sets = Math.floor(x.n / x.pc), d = sets * (x.s / x.n * x.pc - x.pp);
        if (d > 0) desc.push([`Promo ${x.pc} x ${money(x.pp)}${sets > 1 ? ' (x' + sets + ')' : ''}`, d]);
      });
      const total = sub - desc.reduce((a, d) => a + d[1], 0);
      return { lineas, desc, total, u };
    }

    function pintar() {
      document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.cat === cat && !$('#q').value));
      lista();
      const { total, u } = calc(), bar = $('#bar');
      bar.className = u ? 'on' : '';
      bar.innerHTML = `<span>Ver pedido · ${u} ${u === 1 ? 'botella' : 'botellas'}</span><span>${money(total)}</span>`;
      try { localStorage.setItem('eusebio-pedido', JSON.stringify(cart)); } catch (e) { }
      if ($('#drawer').classList.contains('on')) abrir();
    }

    function abrir() {
      const { lineas, desc, total, u } = calc();
      if (!u) { $('#drawer').classList.remove('on'); return; }
      $('#sheet').innerHTML = `<h2>Tu pedido</h2>
    ${lineas.map(([p, n]) => `<div class="li">
      <div class="li-info">
        <b>${esc(p.nom)}</b>
        <small>${p.ml !== 750 ? '(' + p.ml + ' ml) · ' : ''}${money(p.pre)} c/u</small>
      </div>
      <div class="li-actions">
        <div class="st st-sm">
          <button data-k="${esc(p.k)}" data-d="-1" aria-label="Quitar uno">−</button>
          <b>${n}</b>
          <button data-k="${esc(p.k)}" data-d="1" aria-label="Agregar uno">+</button>
        </div>
        <span class="li-sub">${money(n * p.pre)}</span>
        <button class="del" data-del="${esc(p.k)}" title="Eliminar" aria-label="Eliminar producto">✕</button>
      </div>
    </div>`).join('')}
    ${desc.map(d => `<div class="li d"><span>${esc(d[0])}</span><span>−${money(d[1])}</span></div>`).join('')}
    <div class="tot"><span>Total</span><span>${money(total)}</span></div>
    <label for="nombre">Tu nombre</label><input id="nombre" autocomplete="name">
    <label for="ent">¿Cómo lo recibís?</label>
    <select id="ent"><option>Retiro en Mendoza</option><option>Envío en Mendoza (costo según zona)</option></select>
    <button class="send" id="enviar">Enviar pedido por WhatsApp</button>
    <button class="cerrar" id="cerrar">Seguir viendo vinos</button>`;
      $('#drawer').classList.add('on');
    }

    function enviar() {
      const { lineas, desc, total } = calc(), nombre = $('#nombre').value.trim();
      let m = 'Hola Eusebio Wines! Quiero hacer este pedido:\n\n';
      lineas.forEach(([p, n]) => { m += `• ${n} x ${p.nom}${p.ml !== 750 ? ' (' + p.ml + ' ml)' : ''} — ${money(n * p.pre)}\n`; });
      desc.forEach(d => { m += `• ${d[0]}: −${money(d[1])}\n`; });
      m += `\nTotal: ${money(total)}\n${$('#ent').value}`;
      if (nombre) m += `\nNombre: ${nombre}`;
      window.open(`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(m)}`, '_blank');
    }

    document.addEventListener('click', e => {
      const t = e.target.closest('button, #drawer');
      if (!t) return;
      if (t.dataset.del) {
        delete cart[t.dataset.del];
        pintar();
      } else if (t.dataset.k) {
        const n = (cart[t.dataset.k] || 0) + +t.dataset.d;
        if (n > 0) cart[t.dataset.k] = n; else delete cart[t.dataset.k];
        pintar();
      } else if (t.dataset.cat) { 
        cat = t.dataset.cat; 
        $('#q').value = ''; 
        pintar(); 
      }
      else if (t.id === 'bar') abrir();
      else if (t.id === 'enviar') enviar();
      else if (t.id === 'cerrar' || t.id === 'drawer') $('#drawer').classList.remove('on');
    });
    $('#q').addEventListener('input', pintar);
    $('#bod').addEventListener('change', pintar);
  </script>
</body>

</html>
